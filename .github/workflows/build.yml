name: Build Windows portable (MobileNet)
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Requires the maintainer to publish the pinned models-v1 release asset.
      - run: node scripts/fetch-encoder.mjs
      - run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml
      - run: node scripts/package-windows.mjs src-tauri/target/release dist/windows-portable
      - uses: actions/upload-artifact@v4
        with:
          name: sclerite-studio-windows-x64-mobilenet
          path: dist/windows-portable/
          if-no-files-found: error
